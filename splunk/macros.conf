[soc_fk_index]
definition = index=*
description = Indexes that hold your security data. Change to e.g. (index=wineventlog OR index=sysmon).
iseval = 0

[soc_fk_sysmon]
definition = `soc_fk_index` (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational")
description = Sysmon events rendered as XML (Splunk Add-on for Sysmon).
iseval = 0

[soc_fk_security]
definition = `soc_fk_index` (source="XmlWinEventLog:Security" OR source="WinEventLog:Security")
description = Windows Security log. Searches use XML field names (renderXml = true).
iseval = 0

[soc_fk_process_creation]
definition = ((`soc_fk_sysmon` EventCode=1) OR (`soc_fk_security` EventCode=4688)) | eval Image=coalesce(Image, NewProcessName, New_Process_Name), ParentImage=coalesce(ParentImage, ParentProcessName, Creator_Process_Name), CommandLine=coalesce(CommandLine, Process_Command_Line)
description = Process creation from Sysmon 1 or Security 4688, normalized to Sysmon field names.
iseval = 0
